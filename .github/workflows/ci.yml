name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: mygames
          POSTGRES_PASSWORD: mygames
          POSTGRES_DB: mygames
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mygames"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://mygames:mygames@localhost:5432/mygames_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Build, typecheck'in ihtiyaç duyduğu Paraglide çıktısını da üretir.
      - run: pnpm build
      - run: pnpm typecheck
      # MinIO ve eski veri dump'ı CI'da yok; o testler kendiliğinden atlanır.
      - run: pnpm test

  # Sürüm numarası: son `vN` etiketinin bir fazlası (hiç yoksa 1). Etiket deploy başarılı olunca atılır; başarısız
  # ya da iptal edilen çalışmalar numara harcamaz.
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.next.outputs.number }}
      released_at: ${{ steps.next.outputs.released_at }}
    steps:
      - id: next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref' \
            | sed -n 's#^refs/tags/v\([0-9][0-9]*\)$#\1#p' | sort -n | tail -1)
          number=$(( ${last:-0} + 1 ))
          echo "Sürüm: v$number"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "released_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  images:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [app, worker]
    steps:
      - uses: actions/checkout@v7
      - name: İmaj adını belirle (GHCR küçük harf ister)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.target }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: |
            APP_VERSION=${{ needs.version.outputs.number }}
            APP_RELEASED_AT=${{ needs.version.outputs.released_at }}
            APP_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:v${{ needs.version.outputs.number }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Coolify'da her kaynağın "Webhooks" sekmesindeki deploy URL'i ve bir API token'ı secret olarak eklenir.
      # Secret'lar yoksa adım atlanır (Coolify'da otomatik deploy da kullanılabilir).
      - name: Coolify deploy tetikle
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_DEPLOY_APP_URL: ${{ secrets.COOLIFY_DEPLOY_APP_URL }}
          COOLIFY_DEPLOY_WORKER_URL: ${{ secrets.COOLIFY_DEPLOY_WORKER_URL }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "COOLIFY_TOKEN tanımlı değil, deploy atlandı."
            exit 0
          fi
          deploy() {
            # Coolify'ın deploy uç noktası (`/api/v1/deploy?uuid=…`); yeni sürümler yalnızca POST kabul ediyor.
            [ -n "$2" ] || return 0
            status=$(curl -sS -o /tmp/coolify.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Accept: application/json" "$2")
            echo "$1: HTTP $status"
            cat /tmp/coolify.json; echo
            [ "$status" -lt 300 ] || return 1
          }
          deploy app "$COOLIFY_DEPLOY_APP_URL"
          deploy worker "$COOLIFY_DEPLOY_WORKER_URL"
      # Bu commit'e `vN` etiketi; sonraki çalışma numarayı buradan devam ettirir. Etiket zaten varsa (yeniden
      # çalıştırma) dokunulmaz.
      - name: Sürüm etiketini at
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.version.outputs.number }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG zaten var."
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
            echo "$TAG etiketi atıldı ($GITHUB_SHA)."
          fi
